name: Frontend CI

# -----------------------------------------------------------------------------
# TRIGGERS
# Run this pipeline on:
#   - Any push, to any branch (catches direct commits early)
#   - Any pull request (validates changes before merge)
# -----------------------------------------------------------------------------
on:
  push:
  pull_request:

# Cancel any in-progress run for the same branch/PR when a new commit is pushed,
# to avoid wasting CI minutes on outdated commits.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Centralize the Node.js version so it only needs to be updated in one place.
  NODE_VERSION: "22"
  # Minimum acceptable test coverage percentage.
  COVERAGE_THRESHOLD: 80

jobs:
  build-test-lint:
    name: Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # Pulls the repository code onto the runner so subsequent steps can use it.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # SETUP NODE + CACHE NPM
      # actions/setup-node's built-in "cache: npm" option caches ~/.npm keyed
      # on package-lock.json, which is simpler and more reliable than a manual
      # actions/cache step. It restores the cache before npm ci runs.
      # -----------------------------------------------------------------------
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # -----------------------------------------------------------------------
      # 3. INSTALL DEPENDENCIES (npm ci)
      # npm ci performs a clean, deterministic install strictly from
      # package-lock.json — faster and safer than "npm install" for CI.
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          echo "::group::Installing dependencies (npm ci)"
          npm ci
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 4. ESLINT
      # Lints the codebase for style issues, bugs, and anti-patterns.
      # Assumes an "lint" script is defined in package.json
      # (e.g. "eslint . --max-warnings=0").
      # -----------------------------------------------------------------------
      - name: Run ESLint
        run: |
          echo "::group::ESLint Results"
          npm run lint
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 5. TYPESCRIPT TYPE CHECKING
      # Runs the TypeScript compiler in no-emit mode to validate types across
      # the project without producing build output (fast fail on type errors).
      # -----------------------------------------------------------------------
      - name: Run TypeScript type checking
        run: |
          echo "::group::TypeScript Type Check"
          npx tsc --noEmit
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 6 & 7. VITEST + COVERAGE REPORT
      # Runs the test suite in CI mode (--run disables watch mode) with
      # coverage collection enabled. Assumes @vitest/coverage-v8 (or
      # coverage-istanbul) is installed and configured in vite.config.ts.
      # -----------------------------------------------------------------------
      # 8. FAIL IF COVERAGE < 80%
      # Coverage thresholds are enforced via vitest's built-in
      # coverage.thresholds config (recommended, checked in vite.config.ts),
      # AND re-validated here explicitly against the coverage-summary.json
      # output as a defense-in-depth CI gate, independent of local config.
      # -----------------------------------------------------------------------
      - name: Run Vitest with coverage
        run: |
          echo "::group::Vitest Execution & Coverage Report"
          npx vitest run --coverage
          echo "::endgroup::"

      - name: Enforce coverage threshold
        run: |
          echo "::group::Coverage Threshold Check"
          node -e "
            const fs = require('fs');
            const path = './coverage/coverage-summary.json';
            if (!fs.existsSync(path)) {
              console.error('Coverage summary not found at ' + path + '. Ensure the \"json-summary\" coverage reporter is enabled in vite.config.ts.');
              process.exit(1);
            }
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const pct = summary.total.lines.pct;
            const threshold = ${{ env.COVERAGE_THRESHOLD }};
            console.log('Total line coverage: ' + pct + '% (threshold: ' + threshold + '%)');
            if (pct < threshold) {
              console.error('Coverage ' + pct + '% is below the required ' + threshold + '% threshold.');
              process.exit(1);
            }
            console.log('Coverage threshold met.');
          "
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 9. BUILD (npm run build)
      # Produces the production Vite build (typically outputs to ./dist).
      # Runs only after lint/type-check/test all pass, avoiding wasted build
      # time on broken code.
      # -----------------------------------------------------------------------
      - name: Build application
        run: |
          echo "::group::Vite Production Build"
          npm run build
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # 10. UPLOAD BUILD ARTIFACT
      # Persists the production build output (./dist) as a downloadable
      # artifact for deployment steps, manual QA, or preview environments.
      # -----------------------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 14

      # -----------------------------------------------------------------------
      # UPLOAD COVERAGE ARTIFACT
      # Persists coverage reports separately so results can be inspected even
      # when the build itself is not needed (e.g. after a test-only failure).
      # -----------------------------------------------------------------------
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # -----------------------------------------------------------------------
      # FINAL STATUS SUMMARY
      # Writes a concise, human-readable summary to the GitHub Actions UI
      # (visible on the workflow run page) for quick at-a-glance results.
      # -----------------------------------------------------------------------
      - name: Pipeline summary
        if: always()
        run: |
          echo "## Frontend CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node.js version: ${{ env.NODE_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coverage threshold: ${{ env.COVERAGE_THRESHOLD }}%" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: ${{ github.event_name }} on ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"